<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Northline — Modern Business Solutions</title>

<meta name="description" content="Northline helps modern businesses build stronger brands, better digital experiences and sustainable growth.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#111827;
    background:#ffffff;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* NAVIGATION */

header{
    position:absolute;
    width:100%;
    top:0;
    left:0;
    z-index:10;
}

.nav{
    height:85px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:25px;
    font-weight:800;
    letter-spacing:-1px;
    color:white;
}

.logo span{
    color:#35d0a0;
}

.nav-links{
    display:flex;
    gap:32px;
    align-items:center;
}

.nav-links a{
    color:white;
    font-size:14px;
    font-weight:600;
}

.nav-button{
    background:#35d0a0;
    color:#06281f !important;
    padding:12px 20px;
    border-radius:7px;
}

.menu{
    display:none;
    color:white;
    font-size:28px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:760px;
    display:flex;
    align-items:center;
    background:
    linear-gradient(120deg,#071827 0%,#0d2638 55%,#123e48 100%);
    position:relative;
    overflow:hidden;
}

.hero:after{
    content:"";
    position:absolute;
    width:550px;
    height:550px;
    border-radius:50%;
    background:rgba(53,208,160,.10);
    right:-180px;
    top:-100px;
}

.hero-content{
    max-width:650px;
    position:relative;
    z-index:2;
}

.eyebrow{
    display:inline-block;
    color:#35d0a0;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:20px;
    text-transform:uppercase;
}

.hero h1{
    color:white;
    font-size:clamp(45px,6vw,76px);
    line-height:1.04;
    letter-spacing:-3px;
    margin-bottom:25px;
}

.hero p{
    color:#c5d2db;
    font-size:18px;
    max-width:570px;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:15px 25px;
    border-radius:7px;
    font-weight:700;
    font-size:14px;
}

.btn-primary{
    background:#35d0a0;
    color:#06281f;
}

.btn-outline{
    border:1px solid rgba(255,255,255,.3);
    color:white;
}

/* HERO CARD */

.hero-card{
    position:absolute;
    right:7%;
    bottom:70px;
    width:360px;
    height:235px;
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 30px 80px rgba(0,0,0,.3);
    z-index:3;
    transform:rotate(3deg);
}

.hero-card-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
}

.hero-card-logo{
    font-weight:800;
}

.dot{
    width:10px;
    height:10px;
    background:#35d0a0;
    border-radius:50%;
}

.fake-line{
    height:10px;
    background:#e8edf0;
    border-radius:10px;
    margin:12px 0;
}

.fake-line.short{
    width:55%;
}

.hero-products{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.product{
    height:70px;
    flex:1;
    border-radius:8px;
    background:#eef3f3;
}

/* GENERAL */

section{
    padding:105px 0;
}

.section-head{
    max-width:680px;
    margin-bottom:55px;
}

.section-label{
    color:#159c78;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    font-weight:800;
    margin-bottom:12px;
}

.section-head h2{
    font-size:45px;
    line-height:1.12;
    letter-spacing:-2px;
    margin-bottom:18px;
}

.section-head p{
    color:#667085;
    font-size:17px;
}

/* ABOUT */

.about{
    background:#f7f9fa;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.about h2{
    font-size:45px;
    line-height:1.15;
    letter-spacing:-2px;
}

.about-text{
    color:#667085;
    font-size:17px;
    margin-bottom:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:white;
    padding:22px;
    border-radius:10px;
    border:1px solid #e8ecef;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

.stat span{
    color:#667085;
    font-size:13px;
}

/* SERVICES */

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    padding:32px;
    border:1px solid #e7eaed;
    border-radius:12px;
    transition:.3s;
}

.service:hover{
    transform:translateY(-7px);
    box-shadow:0 20px 45px rgba(0,0,0,.08);
}

.icon{
    width:48px;
    height:48px;
    background:#e9faf5;
    color:#159c78;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    margin-bottom:22px;
}

.service h3{
    font-size:20px;
    margin-bottom:10px;
}

.service p{
    color:#667085;
    font-size:14px;
}

/* PROJECTS */

.projects{
    background:#f7f9fa;
}

.projects-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.project{
    background:white;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e8ecef;
}

.project-image{
    height:290
